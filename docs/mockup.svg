<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1132 1120" width="1132" height="1120" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <style>
      .page { fill: #fff; stroke: #003a7d; }
      .zone { fill: #fff; stroke: #c00020; }
      .field { fill: #fff; stroke: #000; }
      .page-label { fill: #003a7d; }
      .zone-label { fill: #c00020; }
      .mask { fill: #fff; stroke: none; }
      text { dominant-baseline: middle; }
      .center { text-anchor: middle; }
    </style>
    <g id="header">
      <rect class="zone" x="0" y="0" width="468" height="92" rx="10"/>
      <rect class="mask" x="16" y="-10" width="60" height="20"/>
      <text class="zone-label" x="20" y="0">En-tête</text>
      <rect class="field" x="17" y="14" width="436" height="28" rx="10"/>
      <text class="center" x="235" y="29">Titre</text>
      <rect class="field" x="17" y="52" width="150" height="28" rx="10"/>
      <text class="center" x="92" y="67">destination</text>
      <rect class="field" x="173" y="52" width="86" height="28" rx="10"/>
      <text class="center" x="216" y="67">arrivée</text>
      <rect class="field" x="265" y="52" width="86" height="28" rx="10"/>
      <text class="center" x="308" y="67">départ</text>
      <rect class="field" x="357" y="52" width="96" height="28" rx="10"/>
      <text class="center" x="405" y="67">voyageurs</text>
    </g>
    <g id="listing">
      <rect class="zone" x="0" y="0" width="142" height="92" rx="10"/>
      <rect class="mask" x="14" y="-10" width="76" height="20"/>
      <text class="zone-label" x="18" y="0">Logement</text>
    </g>
    <!-- Rappel du logement en haut des pages "services" et "avis" -->
    <g id="listing-summary">
      <rect class="zone" x="0" y="0" width="468" height="46" rx="10"/>
      <rect class="mask" x="16" y="-10" width="76" height="20"/>
      <text class="zone-label" x="20" y="0">Logement</text>
    </g>
    <g id="service">
      <rect class="field" x="0" y="0" width="212" height="28" rx="10"/>
      <text class="center" x="106" y="15">service</text>
    </g>
    <g id="review">
      <rect class="field" x="0" y="0" width="436" height="38" rx="10"/>
      <text x="14" y="19">note · auteur · date · commentaire</text>
    </g>
  </defs>

  <rect width="1132" height="1120" fill="#fff"/>

  <!-- a. Résultats de recherche -->
  <g>
    <rect class="page" x="2" y="16" width="515" height="625" rx="10"/>
    <rect class="mask" x="18" y="6" width="82" height="20"/>
    <text class="page-label" x="22" y="16">Résultats</text>

    <use href="#header" x="27" y="46"/>

    <use href="#listing" x="27" y="188"/>
    <use href="#listing" x="189" y="188"/>
    <use href="#listing" x="351" y="188"/>
    <use href="#listing" x="27" y="296"/>
    <use href="#listing" x="189" y="296"/>
    <use href="#listing" x="351" y="296"/>
    <use href="#listing" x="27" y="404"/>
    <use href="#listing" x="189" y="404"/>
    <use href="#listing" x="351" y="404"/>
    <use href="#listing" x="27" y="512"/>
    <use href="#listing" x="189" y="512"/>
    <use href="#listing" x="351" y="512"/>
  </g>

  <!-- b. Page d'un logement -->
  <g transform="translate(612 0)">
    <rect class="page" x="2" y="16" width="515" height="625" rx="10"/>
    <rect class="mask" x="18" y="6" width="84" height="20"/>
    <text class="page-label" x="22" y="16">Logement</text>

    <use href="#header" x="27" y="46"/>

    <rect class="zone" x="27" y="188" width="468" height="56" rx="10"/>
    <rect class="mask" x="43" y="178" width="102" height="20"/>
    <text class="zone-label" x="47" y="188">Métadonnées</text>

    <rect class="zone" x="27" y="266" width="468" height="56" rx="10"/>
    <rect class="mask" x="43" y="256" width="66" height="20"/>
    <text class="zone-label" x="47" y="266">Mobilité</text>

    <rect class="zone" x="27" y="344" width="468" height="178" rx="10"/>
    <rect class="mask" x="43" y="334" width="90" height="20"/>
    <text class="zone-label" x="47" y="344">Description</text>

    <rect class="zone" x="27" y="544" width="468" height="60" rx="10"/>
    <rect class="mask" x="43" y="534" width="46" height="20"/>
    <text class="zone-label" x="47" y="544">Liens</text>
    <rect class="field" x="44" y="560" width="212" height="28" rx="10"/>
    <text class="center" x="150" y="575">services</text>
    <rect class="field" x="266" y="560" width="212" height="28" rx="10"/>
    <text class="center" x="372" y="575">avis</text>
  </g>

  <!-- c. Page des services d'un logement -->
  <g transform="translate(0 660)">
    <rect class="page" x="2" y="16" width="515" height="440" rx="10"/>
    <rect class="mask" x="18" y="6" width="76" height="20"/>
    <text class="page-label" x="22" y="16">Services</text>

    <use href="#header" x="27" y="46"/>
    <use href="#listing-summary" x="27" y="188"/>

    <rect class="zone" x="27" y="256" width="468" height="164" rx="10"/>
    <rect class="mask" x="43" y="246" width="68" height="20"/>
    <text class="zone-label" x="47" y="256">Services</text>
    <use href="#service" x="44" y="272"/>
    <use href="#service" x="266" y="272"/>
    <use href="#service" x="44" y="308"/>
    <use href="#service" x="266" y="308"/>
    <use href="#service" x="44" y="344"/>
    <use href="#service" x="266" y="344"/>
    <use href="#service" x="44" y="380"/>
    <use href="#service" x="266" y="380"/>
  </g>

  <!-- d. Page des avis d'un logement -->
  <g transform="translate(612 660)">
    <rect class="page" x="2" y="16" width="515" height="440" rx="10"/>
    <rect class="mask" x="18" y="6" width="50" height="20"/>
    <text class="page-label" x="22" y="16">Avis</text>

    <use href="#header" x="27" y="46"/>
    <use href="#listing-summary" x="27" y="188"/>

    <rect class="zone" x="27" y="256" width="468" height="164" rx="10"/>
    <rect class="mask" x="43" y="246" width="42" height="20"/>
    <text class="zone-label" x="47" y="256">Avis</text>
    <use href="#review" x="43" y="272"/>
    <use href="#review" x="43" y="318"/>
    <use href="#review" x="43" y="364"/>
  </g>
</svg>
